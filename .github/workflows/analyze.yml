name: Analizar partidos y alertar

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Evitar jobs solapados: dos instancias corriendo a la vez generan race
# conditions en git push y podrian duplicar alertas
concurrency:
  group: gol-analyzer
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar análisis (365scores)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node run_flashscore.js

      - name: Debug — ver cambios antes de commit
        run: git status && git diff --stat

      - name: Commit y push de cambios (aprendizaje persistente)
        run: |
          git config user.name "sofastats-bot"
          git config user.email "sofastats-bot@users.noreply.github.com"
          git add predictions.json weights.json teams.json last-local-run.json alertas.json telegram-offset.txt 2>/dev/null || true
          if git diff --cached --quiet && git diff --quiet; then
            echo "Sin cambios nuevos"
          else
            git diff --cached --quiet || git commit -m "auto: aprendizaje ronda ${{ github.run_id }}"
          fi
          git pull --rebase || true
          git push
        shell: bash
