name: Analizar partidos y alertar

on:
  schedule:
    # Cada 10 min. Antes era cada 5 (288 corridas/dia) para alimentar un
    # aprendizaje en vivo que perseguia ruido. Ahora el modelo se entrena
    # offline, asi que la unica razon para correr seguido es no perder
    # partidos: 10 min basta.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: gol-analyzer
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium para Playwright
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Analizar y alertar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opcional: filtro IA para el tier VALOR. Sin key, ese tier no alerta.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: node run_flashscore.js

      - name: Guardar datos etiquetados
        if: always()
        run: |
          git config user.name "sofastats-bot"
          git config user.email "sofastats-bot@users.noreply.github.com"
          git add predictions.json snapshots.jsonl state.json alertas.json alertas_log.json telegram-offset.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos"
          else
            git commit -m "datos: ronda ${{ github.run_id }} [skip ci]" || true
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "reintento $i de push"
              sleep 5
            done
          fi
        shell: bash
