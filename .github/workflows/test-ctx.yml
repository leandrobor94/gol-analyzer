name: Test contexto IA
on:
  workflow_dispatch:
jobs:
  ctx:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar estimacion de ritmo por IA
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MAX_CASOS: "120"
        run: node _test_ctx.js
